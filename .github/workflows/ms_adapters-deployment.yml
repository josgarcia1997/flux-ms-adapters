name: adapters-ms-deployment

on:
  push:
    branches:
      - stg

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: flux-ms-adapters

permissions:
  contents: read
  packages: write


jobs:

  quality:
    name: Tests + SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint -f json -o eslint-report.json || true

#      - name: Run tests
#        run: pnpm test:cov

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_LARAVEL }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-lint:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error


  integration-tests:
    name: Validate DB & E2E Tests
    runs-on: ubuntu-latest
    needs: docker-lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flux_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: flux_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

#      - name: Run E2E tests
#        run: pnpm test:e2e


  build:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: integration-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }},${{ env.REGISTRY }}/${{ github.repository }}:latest

  container-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}

  copy-compose:
    name: Copy docker-compose
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ADAPTERS_DOMINIO }}
          username: ${{ secrets.ADAPTERS_EC2_USER }}
          key: ${{ secrets.ADAPTERS_EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/var/www/html/adapters-service"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: copy-compose

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          ADAPTERS_ENV: ${{ secrets.ADAPTERS_ENV }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ADAPTERS_DOMINIO }}
          username: ${{ secrets.ADAPTERS_EC2_USER }}
          key: ${{ secrets.ADAPTERS_EC2_SSH_KEY }}
          envs: ADAPTERS_ENV,GITHUB_TOKEN
          script: |
            set -eo pipefail

            APP_DIR="/var/www/html/adapters-service"

            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "$ADAPTERS_ENV" > .env

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

